<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MTC Storage Calculator</title>
<style>
  :root { --line: #000; --muted: #555; --shade: #f2f2f2; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 64px; background: #fff; color: #000;
    font: 14px/1.35 -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  main { max-width: 1180px; margin: 0 auto; }
  h1 {
    font-size: 20px; margin: 0 0 16px; padding-bottom: 6px; border-bottom: 3px solid var(--line);
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap;
  }
  h1 .links { display: flex; gap: 14px; align-items: baseline; }
  h1 .links a, h1 .links button {
    font: inherit; font-size: 13px; font-weight: 400; color: var(--muted); text-decoration: underline;
    background: none; border: 0; padding: 0; cursor: pointer;
  }
  h1 .links a:hover, h1 .links button:hover { color: #000; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; margin: 0 0 20px; border: 1px solid var(--line); }
  th, td { border: 1px solid var(--line); padding: 4px 6px; vertical-align: middle; }
  th { text-align: left; font-weight: 600; background: var(--shade); }
  tr.part th {
    background: #000; color: #fff; text-transform: uppercase; letter-spacing: .04em; font-size: 12px;
  }
  td.n { width: 3.2em; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
  td.f {
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; color: var(--muted);
    white-space: nowrap;
  }
  td.v, th.v {
    text-align: right; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px;
    font-variant-numeric: tabular-nums; white-space: nowrap; width: 13em;
  }
  td.v .sub { color: var(--muted); font-size: 11px; display: block; }
  td.blank { background: var(--shade); }
  tr.total td { font-weight: 700; border-top: 2px solid var(--line); }
  .in { display: flex; align-items: center; gap: 6px; justify-content: flex-end; }
  .in input[type=range] { flex: 1; min-width: 70px; accent-color: #000; }
  .in input[type=number] {
    width: 6.5em; font: inherit; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px;
    text-align: right; border: 1px solid var(--line); border-radius: 0; padding: 2px 4px; background: #fff; color: #000;
  }
  th.v.wide, td.v.wide { width: 17em; }
  .mixwrap { margin: 4px 7px 8px; }
  .mixlabels { position: relative; height: 30px; }
  .mixlabels .lbl {
    position: absolute; top: 0; font-size: 11px; line-height: 14px; text-align: center; white-space: nowrap;
  }
  .mixlabels .lbl i {
    display: inline-block; width: 8px; height: 8px; margin-right: 3px; border: 1px solid var(--line);
  }
  .mixlabels .lbl b { font-weight: 400; }
  .mixlabels .lbl em { font-style: normal; color: var(--muted); }
  .mixlabels .lbl u { text-decoration: none; }
  .mixlabels .lbl span {
    display: block; font-family: ui-monospace, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums;
  }
  .mixlead { display: block; width: 100%; height: 18px; overflow: visible; }
  .mixlead path { fill: none; stroke: var(--line); stroke-width: 1; }
  .mix { position: relative; height: 24px; border: 1px solid var(--line); touch-action: none; cursor: pointer; user-select: none; }
  .mix .seg { position: absolute; top: 0; bottom: 0; }
  .mix .seg:nth-child(1), .mixlabels .lbl:nth-child(1) i { background: #000; }
  .mix .seg:nth-child(2), .mixlabels .lbl:nth-child(2) i { background: #555; }
  .mix .seg:nth-child(3), .mixlabels .lbl:nth-child(3) i { background: #aaa; }
  .mix .seg:nth-child(4), .mixlabels .lbl:nth-child(4) i { background: #eee; }
  .mix .h {
    position: absolute; top: -5px; bottom: -5px; background: #fff; border: 1px solid var(--line); cursor: ew-resize;
  }
  .mix .h:focus { outline: none; }
  .mix .h:focus-visible { background: #000; box-shadow: inset 0 0 0 1px #fff; }
</style>
</head>
<body>
<main>
<h1><span>Merkle Tree CA &amp; Mirror Storage</span><span class="links"><button type="button" id="csv">Download CSV</button><a href="https://github.com/mcpherrinm/mtsizecalc">Source</a></span></h1>
<div class="scroll"><table id="headline"></table></div>
<div class="scroll"><table id="form"></table></div>
</main>

<script>
"use strict";

// ---------- Inputs ----------
// Per-column inputs have keys suffixed A / B.
const INPUTS = {
  logsA:  { v: 2,   min: 0,   max: 16,   step: 1 },
  logsB:  { v: 2,   min: 0,   max: 16,   step: 1 },
  lifeA:  { v: 6,   min: 1,   max: 100,  step: 1 },
  lifeB:  { v: 45,  min: 1,   max: 100,  step: 1 },
  renA:   { v: 4,   min: 1,   max: 100,  step: 0.5 },
  renB:   { v: 30,  min: 1,   max: 100,  step: 0.5 },
  active: { v: 682, min: 1,   max: 3000, step: 1 },
  shareA: { v: 10,  min: 0,   max: 100,  step: 1 },
  p256:   { v: 30,  min: 0,   max: 100,  step: 1 },
  mldsa:  { v: 10,  min: 0,   max: 100,  step: 1 },
  mldsa87:{ v: 0,   min: 0,   max: 100,  step: 1 },
  entry:  { v: 300, min: 100, max: 1500, step: 1 },
  compressed: { v: 25,  min: 5,   max: 100,  step: 1 },
  caRetention: { v: 35,  min: 0,   max: 730,  step: 1 },
  mirrorRetention: { v: 35,  min: 0,   max: 730,  step: 1 },
  cpint:  { v: 2,   min: 0.1, max: 60,   step: 0.1 },
  leshare:{ v: 50,  min: 1,   max: 100,  step: 1 },
};

// Snap x to the input's step and clamp it to [min, max].
function normalize(s, x) {
  x = +(Math.round((x - s.min) / s.step) * s.step + s.min).toFixed(6);
  return Math.min(s.max, Math.max(s.min, x));
}

// Restore from URL hash.
try {
  const q = new URLSearchParams(location.hash.slice(1));
  for (const [k, spec] of Object.entries(INPUTS)) {
    const x = parseFloat(q.get(k));
    if (Number.isFinite(x)) spec.v = normalize(spec, x);
  }
} catch (e) {}

// ---------- Constants ----------
const TILE = 256, HASH = 32, HASH_TILE = TILE * HASH;
const REC_HDR = 4;   // pubkey record: uint16 bundle length + uint16 type
const ENT_HDR = 6;   // entry record: uint16 bundle length + uint16 extensions length + uint16 type
const GZ_REF = 3;    // est. compressed cost of the repeated per-record prefix (back-reference)
const PART_FILL = 127.5; // mean records in a partial tile
const HASH_LEVELS = 4;
const ALGS = [
  { key: "p256",  name: "P-256",     spki: 91,   rand: 64 },
  { key: "rsa",   name: "RSA-2048",  spki: 294,  rand: 256 },
  { key: "mldsa", name: "ML-DSA-44", spki: 1334, rand: 1312 },
  { key: "mldsa87", name: "ML-DSA-87", spki: 2614, rand: 2592 },
];

// ---------- Formatting ----------
const nf0 = new Intl.NumberFormat("en-US", { maximumFractionDigits: 0 });
const nf2 = new Intl.NumberFormat("en-US", { maximumFractionDigits: 2 });
function num(x) { return Math.abs(x) >= 100 ? nf0.format(x) : nf2.format(x); }
function bytes(x) {
  const u = ["B", "KiB", "MiB", "GiB", "TiB", "PiB", "EiB"];
  let i = 0, y = x;
  while (Math.abs(y) >= 1024 && i < u.length - 1) { y /= 1024; i++; }
  const s = i === 0 ? nf0.format(y) : (y >= 100 ? y.toFixed(1) : y >= 10 ? y.toFixed(2) : y.toFixed(3));
  return s + " " + u[i];
}
function bytesCell(x) {
  return x >= 1024 ? `${bytes(x)}<span class="sub">${nf0.format(x)} B</span>` : `${nf0.format(x)} B`;
}

// ---------- Form definition ----------
// Row kinds:
//   part:   section header
//   in2:    per-column input (A,B)
//   in1:    single input
//   mix:    stacked bar of shares summing to 100% (see MIXBARS)
//   calc2:  per-column calc; fn(c, L) -> number where c is "A"|"B"
//   calc1:  single calc; fn(L) -> number
// fmt: "n" (number), "b" (bytes), "p" (percent), "d" (days)
let ROWS;
function defineRows() {
  const lA = () => `${num(V.lifeA)}-day logs (A)`;
  const lB = () => `${num(V.lifeB)}-day logs (B)`;
  ROWS = [
    { kind: "part", label: "Part I — Inputs", cols: true },
    { id: 1,  kind: "in2", label: "Number of logs", keys: ["logsA", "logsB"] },
    { id: 2,  kind: "in2", label: "Certificate lifetime (days)", keys: ["lifeA", "lifeB"] },
    { id: 3,  kind: "in2", label: "Renewal at day", keys: ["renA", "renB"] },
    { id: 4,  kind: "in1", label: "Active certificates (millions)", key: "active" },
    { id: 5,  kind: "mix", mix: "life", label: "Split of active certificates between lifetimes (%)", f: "L5B = 100 − L5A" },
    { id: 6,  kind: "mix", mix: "key", label: "Key mix (%)", f: "L6b = 100 − L6a − L6c − L6d" },
    { id: 7,  kind: "in1", label: "Avg TBSCertificateLogEntry size (bytes)", key: "entry" },
    { id: 8, kind: "in1", label: "Entry tile compression ratio (% of uncompressed)", key: "compressed" },
    { id: "9a", kind: "in1", label: "Retention after expiry, CA (days)", key: "caRetention" },
    { id: "9b", kind: "in1", label: "Retention after expiry, mirror (days)", key: "mirrorRetention" },
    { id: 10, kind: "in1", label: "Checkpoint interval (seconds)", key: "cpint" },
    { id: 11, kind: "in1", label: "Let's Encrypt share of total issuance (%)", key: "leshare" },

    { kind: "part", label: "Part II — Record sizes" },
    { kind: "algs" },
    { id: 12, kind: "calc1", label: "Pubkey record, uncompressed (bytes)", f: "Σ (mix × (4 + SPKI))",
      fn: () => ALGS.reduce((s, a) => s + mix(a.key) * (REC_HDR + a.spki), 0), fmt: "n" },
    { id: 13, kind: "calc1", label: "Pubkey record, compressed (bytes)", f: "Σ (mix × (key + 3))",
      fn: () => ALGS.reduce((s, a) => s + mix(a.key) * (a.rand + GZ_REF), 0), fmt: "n" },
    { id: 14, kind: "calc1", label: "Entry record, uncompressed (bytes)", f: "2 + 2 + 2 + L7",
      fn: () => ENT_HDR + V.entry, fmt: "n" },
    { id: 15, kind: "calc1", label: "Entry record, compressed (bytes)", f: "L14 × L8 ÷ 100",
      fn: L => L[14] * V.compressed / 100, fmt: "n" },
    { id: 16, kind: "calc1", label: "Hash tile (bytes)", f: "256 × 32", fn: () => HASH_TILE, fmt: "n" },

    { kind: "part", label: "Part III — Issuance", cols: true },
    { id: 17, kind: "calc2", label: "Active certificates", f: "L4 × 10⁶ × L5 ÷ 100",
      fn: (c) => V.active * 1e6 * (c === "A" ? V.shareA : 100 - V.shareA) / 100, fmt: "n" },
    { id: 18, kind: "calc2", label: "Issuance per day", f: "L17 ÷ L3", fn: (c, L) => L[17][c] / V["ren" + c], fmt: "n" },
    { id: 19, kind: "calc2", label: "Unexpired certificates", f: "L18 × L2", fn: (c, L) => L[18][c] * V["life" + c], fmt: "n" },
    { id: 20, kind: "calc2", label: "Issuance per day, per log", f: "L18 ÷ L1",
      fn: (c, L) => V["logs" + c] ? L[18][c] / V["logs" + c] : 0, fmt: "n" },
    { id: 21, kind: "calc2", label: "Issuance per second, per log", f: "L20 ÷ 86400", fn: (c, L) => L[20][c] / 86400, fmt: "n" },
    { id: 22, kind: "calc2", label: "Retention window (days)", f: "L2 + L9a", fn: (c) => V["life" + c] + V.caRetention, fmt: "n" },
    { id: 23, kind: "calc2", label: "Retained entries, per log", f: "L20 × L22", fn: (c, L) => L[20][c] * L[22][c], fmt: "n" },

    { kind: "part", label: "Part IV — Objects per log", cols: true },
    { id: 24, kind: "calc2", label: "Entry tiles (full)", f: "⌊L23 ÷ 256⌋", fn: (c, L) => Math.floor(L[23][c] / TILE), fmt: "n" },
    { id: 25, kind: "calc2", label: "Pubkey tiles", f: "L24", fn: (c, L) => L[24][c], fmt: "n" },
    { id: 26, kind: "calc2", label: "Hash tiles, level 0 (full)", f: "⌊L23 ÷ 256⌋", fn: (c, L) => Math.floor(L[23][c] / TILE), fmt: "n" },
    { id: 27, kind: "calc2", label: "Hash tiles, level 1 (full)", f: "⌊L23 ÷ 256²⌋", fn: (c, L) => Math.floor(L[23][c] / TILE ** 2), fmt: "n" },
    { id: 28, kind: "calc2", label: "Hash tiles, level 2 (full)", f: "⌊L23 ÷ 256³⌋", fn: (c, L) => Math.floor(L[23][c] / TILE ** 3), fmt: "n" },
    { id: 29, kind: "calc2", label: "Hash tiles, level 3 (full)", f: "⌊L23 ÷ 256⁴⌋", fn: (c, L) => Math.floor(L[23][c] / TILE ** 4), fmt: "n" },
    { id: 30, kind: "calc2", label: "Frontier partial tiles (entry, pubkey, hash L0–L3)", f: "2 + 4",
      fn: (c, L) => L[23][c] > 0 ? 2 + HASH_LEVELS : 0, fmt: "n" },
    { id: 31, kind: "calc2", label: "Checkpoint + landmarks", f: "2", fn: (c, L) => L[23][c] > 0 ? 2 : 0, fmt: "n" },
    { id: 32, kind: "calc2", label: "Objects per log", f: "L24 + … + L31", total: true,
      fn: (c, L) => [24, 25, 26, 27, 28, 29, 30, 31].reduce((s, i) => s + L[i][c], 0), fmt: "n" },

    { kind: "part", label: "Part V — Bytes per log", cols: true },
    { id: 33, kind: "calc2", label: "Entry tiles, uncompressed", f: "L23 × L14", fn: (c, L) => L[23][c] * L[14], fmt: "b" },
    { id: 34, kind: "calc2", label: "Entry tiles, compressed", f: "L23 × L15", fn: (c, L) => L[23][c] * L[15], fmt: "b" },
    { id: 35, kind: "calc2", label: "Pubkey tiles, uncompressed", f: "L23 × L12", fn: (c, L) => L[23][c] * L[12], fmt: "b" },
    { id: 36, kind: "calc2", label: "Pubkey tiles, compressed", f: "L23 × L13", fn: (c, L) => L[23][c] * L[13], fmt: "b" },
    { id: 37, kind: "calc2", label: "Hash tiles (not compressed)", f: "32 × Σₖ₌₀³ ⌊L23 ÷ 256ᵏ⌋",
      fn: (c, L) => hashBytes(L[23][c]), fmt: "b" },
    { id: 38, kind: "calc2", label: "Per log, uncompressed", f: "L33 + L35 + L37", total: true,
      fn: (c, L) => L[33][c] + L[35][c] + L[37][c], fmt: "b" },
    { id: 39, kind: "calc2", label: "Per log, stored (compressed)", f: "L34 + L36 + L37", total: true,
      fn: (c, L) => L[34][c] + L[36][c] + L[37][c], fmt: "b" },

    { kind: "part", label: "Part VI — All logs of each type", cols: true },
    { id: 40, kind: "calc2", label: "Objects", f: "L32 × L1", fn: (c, L) => L[32][c] * V["logs" + c], fmt: "n" },
    { id: 41, kind: "calc2", label: "Uncompressed", f: "L38 × L1", fn: (c, L) => L[38][c] * V["logs" + c], fmt: "b" },
    { id: 42, kind: "calc2", label: "Stored (compressed)", f: "L39 × L1", fn: (c, L) => L[39][c] * V["logs" + c], fmt: "b" },
    { id: 43, kind: "calc2", label: "  of which pubkey tiles (compressed)", f: "L36 × L1", fn: (c, L) => L[36][c] * V["logs" + c], fmt: "b" },

    { kind: "part", label: "Part VII — CA writes per day, per log", cols: true },
    { id: 44, kind: "calc2", label: "Checkpoints per day", f: "min(86400 ÷ L10, L20)",
      fn: (c, L) => Math.min(86400 / V.cpint, L[20][c]), fmt: "n" },
    { id: 45, kind: "calc2", label: "Entries per checkpoint", f: "L20 ÷ L44",
      fn: (c, L) => L[44][c] ? L[20][c] / L[44][c] : 0, fmt: "n" },
    { id: 46, kind: "calc2", label: "Full tile PUTs", f: "L20 × (2 + Σₖ₌₀³ 256⁻ᵏ) ÷ 256",
      fn: (c, L) => L[20][c] / TILE * (2 + hashLevelSum()), fmt: "n" },
    { id: 47, kind: "calc2", label: "Hash levels rewritten per checkpoint", f: "Σₖ₌₀³ min(1, L45 ÷ 256ᵏ)",
      fn: (c, L) => dirtyLevels(L[45][c]), fmt: "n" },
    { id: 48, kind: "calc2", label: "Partial tile PUTs", f: "L44 × (2 + L47)", fn: (c, L) => L[44][c] * (2 + L[47][c]), fmt: "n" },
    { id: 49, kind: "calc2", label: "Partial tile DELETEs", f: "L48", fn: (c, L) => L[48][c], fmt: "n" },
    { id: 50, kind: "calc2", label: "Checkpoint PUTs", f: "L44", fn: (c, L) => L[44][c], fmt: "n" },
    { id: 51, kind: "calc2", label: "Total object operations", f: "L46 + L48 + L49 + L50", total: true,
      fn: (c, L) => L[46][c] + L[48][c] + L[49][c] + L[50][c], fmt: "n" },
    { id: 52, kind: "calc2", label: "Bytes written, full tiles (compressed)", f: "L20 × (L15 + L13 + 32 × Σₖ₌₀³ 256⁻ᵏ)",
      fn: (c, L) => L[20][c] * (L[15] + L[13] + HASH * hashLevelSum()), fmt: "b" },
    { id: 53, kind: "calc2", label: "Bytes written, partial tiles (compressed)", f: "L44 × 127.5 × (L15 + L13 + 32 × L47)",
      fn: (c, L) => L[44][c] * PART_FILL * (L[15] + L[13] + HASH * L[47][c]), fmt: "b" },
    { id: 54, kind: "calc2", label: "Bytes written per day, per log", f: "L52 + L53", total: true,
      fn: (c, L) => L[52][c] + L[53][c], fmt: "b" },
    { id: 55, kind: "calc2", label: "Object operations per day, all logs of type", f: "L51 × L1",
      fn: (c, L) => L[51][c] * V["logs" + c], fmt: "n" },
    { id: 56, kind: "calc2", label: "Bytes written per day, all logs of type", f: "L54 × L1",
      fn: (c, L) => L[54][c] * V["logs" + c], fmt: "b" },

    { kind: "part", label: "Part VIII — Mirror (all CAs, no pubkey tiles)", cols: true },
    { id: 57, kind: "calc2", label: "Retention window (days)", f: "L2 + L9b", fn: (c) => V["life" + c] + V.mirrorRetention, fmt: "n" },
    { id: 58, kind: "calc2", label: "Retained entries", f: "L20 × L1 × L57 ÷ (L11 ÷ 100)",
      fn: (c, L) => L[20][c] * V["logs" + c] * L[57][c] / (V.leshare / 100), fmt: "n" },
    { id: 59, kind: "calc2", label: "Entry tiles (full)", f: "⌊L58 ÷ 256⌋", fn: (c, L) => Math.floor(L[58][c] / TILE), fmt: "n" },
    { id: 60, kind: "calc2", label: "Hash tiles, levels 0–3 (full)", f: "Σₖ₌₁⁴ ⌊L58 ÷ 256ᵏ⌋",
      fn: (c, L) => { let t = 0; for (let k = 1; k <= HASH_LEVELS; k++) t += Math.floor(L[58][c] / TILE ** k); return t; }, fmt: "n" },
    { id: 61, kind: "calc2", label: "Objects", f: "L59 + L60", total: true, fn: (c, L) => L[59][c] + L[60][c], fmt: "n" },
    { id: 62, kind: "calc2", label: "Entry tiles, uncompressed", f: "L58 × L14", fn: (c, L) => L[58][c] * L[14], fmt: "b" },
    { id: 63, kind: "calc2", label: "Entry tiles, compressed", f: "L58 × L15", fn: (c, L) => L[58][c] * L[15], fmt: "b" },
    { id: 64, kind: "calc2", label: "Hash tiles (not compressed)", f: "32 × Σₖ₌₀³ ⌊L58 ÷ 256ᵏ⌋",
      fn: (c, L) => hashBytes(L[58][c]), fmt: "b" },
    { id: 65, kind: "calc2", label: "Uncompressed", f: "L62 + L64", total: true, fn: (c, L) => L[62][c] + L[64][c], fmt: "b" },
    { id: 66, kind: "calc2", label: "Stored (compressed)", f: "L63 + L64", total: true, fn: (c, L) => L[63][c] + L[64][c], fmt: "b" },
    { id: 67, kind: "calc1", label: "Mirror objects", f: "L61A + L61B", total: true, fn: L => L[61].A + L[61].B, fmt: "n" },
    { id: 68, kind: "calc1", label: "Mirror uncompressed", f: "L65A + L65B", total: true, fn: L => L[65].A + L[65].B, fmt: "b" },
    { id: 69, kind: "calc1", label: "Mirror stored (compressed)", f: "L66A + L66B", total: true, fn: L => L[66].A + L[66].B, fmt: "b" },

    { kind: "part", label: "Part IX — Summary" },
    { kind: "summary" },
  ];
  ROWS.lA = lA; ROWS.lB = lB;
}

const MIXKEYS = ["p256", "mldsa", "mldsa87"];
function mix(k) {
  if (MIXKEYS.includes(k)) return V[k] / 100;
  return (100 - MIXKEYS.reduce((s, m) => s + V[m], 0)) / 100;
}
function hashLevelSum() { let s = 0; for (let k = 0; k < HASH_LEVELS; k++) s += TILE ** -k; return s; }
function dirtyLevels(b) {
  if (b <= 0) return 0;
  let s = 0; for (let k = 0; k < HASH_LEVELS; k++) s += Math.min(1, b / TILE ** k); return s;
}
// Hash tiles at level k hold the ⌊n ÷ 256ᵏ⌋ hashes of that level, full and partial tiles alike.
function hashBytes(n) {
  let s = 0; for (let k = 0; k < HASH_LEVELS; k++) s += Math.floor(n / TILE ** k); return s * HASH;
}

// ---------- State ----------
const V = {};
function readValues() {
  for (const [k, s] of Object.entries(INPUTS)) V[k] = s.v;
  for (const c of ["A", "B"]) V["ren" + c] = Math.min(V["ren" + c], V["life" + c]);
}

function constrain(changed) {
  const I = INPUTS;
  for (const c of ["A", "B"]) {
    // The stored renewal day is only clamped when it's edited itself, so an
    // intermediate keystroke in the lifetime field (the "6" of "60") doesn't
    // lose it; readValues applies the limit instead.
    I["ren" + c].max = I["life" + c].v;
  }
  // Keep the key mix at or under 100% by taking the excess from the other shares.
  let over = MIXKEYS.reduce((s, m) => s + I[m].v, 0) - 100;
  for (const m of MIXKEYS) {
    if (over <= 0) break;
    if (m === changed) continue;
    const d = Math.min(over, I[m].v);
    I[m].v -= d; over -= d;
  }
}

function compute() {
  const L = {};
  for (const r of ROWS) {
    if (r.kind === "calc1") L[r.id] = r.fn(L);
    else if (r.kind === "calc2") L[r.id] = { A: r.fn("A", L), B: r.fn("B", L) };
  }
  return L;
}

function totals(L) {
  return {
    caObj: L[40].A + L[40].B, caU: L[41].A + L[41].B, caS: L[42].A + L[42].B,
    pkObj: (L[25].A + (L[23].A > 0 ? 1 : 0)) * V.logsA + (L[25].B + (L[23].B > 0 ? 1 : 0)) * V.logsB,
    pkS: L[43].A + L[43].B,
  };
}

// ---------- Rendering ----------
function fmtVal(x, fmt) {
  if (!Number.isFinite(x)) return "—";
  if (fmt === "b") return bytesCell(x);
  if (fmt === "p") return nf2.format(x) + "%";
  return num(x);
}

function inputCell(key) {
  const s = INPUTS[key];
  return `<div class="in"><input type="range" data-k="${key}" min="${s.min}" max="${s.max}" step="${s.step}" value="${s.v}">` +
         `<input type="number" data-k="${key}" min="${s.min}" max="${s.max}" step="${s.step}" value="${s.v}"></div>`;
}

function build() {
  const t = document.getElementById("form");
  let h = "";
  for (const r of ROWS) {
    if (r.kind === "part") {
      h += `<tr class="part"><th colspan="3">${r.label}</th>` +
           (r.cols ? `<th class="v wide" data-hdr="A"></th><th class="v wide" data-hdr="B"></th>` : `<th class="v wide" colspan="2"></th>`) + `</tr>`;
    } else if (r.kind === "in2") {
      h += `<tr><td class="n">${r.id}</td><td colspan="2">${r.label}</td>` +
           `<td class="v wide">${inputCell(r.keys[0])}</td><td class="v wide">${inputCell(r.keys[1])}</td></tr>`;
    } else if (r.kind === "in1") {
      h += `<tr><td class="n">${r.id}</td><td colspan="2">${r.label}</td>` +
           `<td class="v wide" colspan="2">${inputCell(r.key)}</td></tr>`;
    } else if (r.kind === "mix") {
      // r.f is only exported to the CSV; the bar shows the relationship.
      h += `<tr><td class="n">${r.id}</td><td colspan="2">${r.label}</td>` +
           `<td colspan="2" data-mix="${r.mix}">${mixBarHTML(MIXBARS[r.mix])}</td></tr>`;
    } else if (r.kind === "calc1") {
      h += `<tr${r.total ? ' class="total"' : ""}><td class="n">${r.id}</td><td>${r.label}</td><td class="f">${r.f}</td>` +
           `<td class="blank"></td><td class="v wide" data-id="${r.id}"></td></tr>`;
    } else if (r.kind === "calc2") {
      h += `<tr${r.total ? ' class="total"' : ""}><td class="n">${r.id}</td><td>${r.label}</td><td class="f">${r.f}</td>` +
           `<td class="v wide" data-id="${r.id}" data-c="A"></td><td class="v wide" data-id="${r.id}" data-c="B"></td></tr>`;
    } else if (r.kind === "algs") {
      h += `<tr><td colspan="5" style="padding:0"><table id="algs" style="margin:0;border:0"></table></td></tr>`;
    } else if (r.kind === "summary") {
      h += `<tr><td colspan="5" style="padding:0"><table id="summary" style="margin:0;border:0"></table></td></tr>`;
    }
  }
  t.innerHTML = h;

  t.addEventListener("input", e => {
    const k = e.target.dataset.k;
    if (!k) return;
    const s = INPUTS[k];
    let x = parseFloat(e.target.value);
    if (!Number.isFinite(x)) return;
    s.v = normalize(s, x);
    constrain(k);
    update(e.target);
  });
  // Once a number field is committed (blur/Enter), show the value actually used.
  t.addEventListener("change", e => { if (e.target.dataset.k) update(); });
  for (const el of t.querySelectorAll("[data-mix]")) buildMixBar(MIXBARS[el.dataset.mix], el);
  window.addEventListener("resize", () => Object.values(MIXBARS).forEach(updateMixBar));
}

// ---------- Mix bars ----------
// A stacked bar of shares that sum to 100%. Handle i sits at the cumulative share of the
// first i + 1 segments; moving it trades share between the segments on either side. Only
// the `stored` shares are inputs; the remaining segment gets whatever is left. Each segment
// is line <id><sfx>; `cols` bars are exported to CSV as the A/B columns of one row, others
// as one row per segment.
const MIXBARS = {
  life: {
    id: 5, cols: true, stored: ["shareA"],
    segs: ["A", "B"].map(c => ({ key: "share" + c, sfx: c, name: () => `${num(V["life" + c])}-day logs` })),
  },
  // Ordered by key size.
  key: {
    id: 6, stored: MIXKEYS,
    segs: [...ALGS].sort((a, b) => a.spki - b.spki).map((g, i) => ({ key: g.key, sfx: "abcd"[i], name: () => g.name })),
  },
};
function share(mb, k) {
  return mb.stored.includes(k) ? INPUTS[k].v : 100 - mb.stored.reduce((s, m) => s + INPUTS[m].v, 0);
}
function mixCum(mb) {
  const c = []; let s = 0;
  for (const g of mb.segs.slice(0, -1)) c.push(s += share(mb, g.key));
  return c;
}
function mixBarHTML(mb) {
  return `<div class="mixwrap"><div class="mixlabels">` +
    mb.segs.map(g => `<div class="lbl"><i></i><b></b><span><em>${mb.id}${g.sfx}</em> <u></u></span></div>`).join("") +
    `</div><svg class="mixlead"><path></path></svg>` +
    `<div class="mix">${mb.segs.map(() => `<div class="seg"></div>`).join("")}` +
    mb.segs.slice(0, -1).map((g, i) => `<div class="h" role="slider" tabindex="0" data-h="${i}"></div>`).join("") +
    `</div></div>`;
}
function moveHandle(mb, i, x) {
  const c = mixCum(mb);
  c[i] = Math.min(i < c.length - 1 ? c[i + 1] : 100, Math.max(i ? c[i - 1] : 0, Math.round(x)));
  mb.segs.forEach((g, j) => {
    if (mb.stored.includes(g.key)) INPUTS[g.key].v = (j < c.length ? c[j] : 100) - (j ? c[j - 1] : 0);
  });
  update();
}
// Each handle gets its own HANDLE_W-pixel slot and the segments share the remaining width,
// so handles never overlap: a 0% segment is two handles side by side.
const HANDLE_W = 8;
function mixGeom(mb) {
  const n = mb.segs.length - 1, W = mb.bar.clientWidth;
  const U = Math.max(0, W - n * HANDLE_W) / 100;  // pixels per percent
  const c = mixCum(mb);
  // Pixel left edge of segment i, and of handle i (which follows segment i).
  const segL = i => (i ? c[i - 1] : 0) * U + i * HANDLE_W;
  const hL = i => c[i] * U + i * HANDLE_W;
  return { n, W, U, c, segL, hL };
}
function buildMixBar(mb, wrap) {
  const bar = mb.bar = wrap.querySelector(".mix");
  mb.labels = [...wrap.querySelector(".mixlabels").children];
  mb.lead = wrap.querySelector(".mixlead");
  let active = null, grab = 0;
  const px = e => e.clientX - bar.getBoundingClientRect().left - bar.clientLeft;
  // Share at which handle i's left edge would sit at pixel x.
  const toPct = (i, x) => { const g = mixGeom(mb); return g.U ? (x - i * HANDLE_W) / g.U : 0; };
  bar.addEventListener("pointerdown", e => {
    const x = px(e), g = mixGeom(mb);
    const h = e.target.closest(".h");
    if (h) {
      // Dragging a handle: keep the pointer where it grabbed the handle.
      active = +h.dataset.h; grab = x - g.hL(active);
    } else {
      // Clicking the bar: move the nearest handle so it is centred on the pointer.
      const d = i => Math.abs(g.hL(i) + HANDLE_W / 2 - x);
      active = 0;
      for (let i = 1; i < g.n; i++) if (d(i) < d(active)) active = i;
      grab = HANDLE_W / 2;
      moveHandle(mb, active, toPct(active, x - grab));
    }
    bar.setPointerCapture(e.pointerId);
    e.preventDefault();
    bar.querySelectorAll(".h")[active].focus();
  });
  bar.addEventListener("pointermove", e => {
    if (active !== null) moveHandle(mb, active, toPct(active, px(e) - grab));
  });
  const end = () => { active = null; };
  bar.addEventListener("pointerup", end);
  bar.addEventListener("pointercancel", end);
  bar.addEventListener("keydown", e => {
    const i = e.target.dataset.h;
    if (i === undefined) return;
    const step = { ArrowLeft: -1, ArrowDown: -1, ArrowRight: 1, ArrowUp: 1, PageDown: -10, PageUp: 10, Home: -100, End: 100 }[e.key];
    if (!step) return;
    moveHandle(mb, +i, mixCum(mb)[i] + step);
    e.preventDefault();
  });
}
function updateMixBar(mb) {
  const bar = mb.bar, segs = bar.querySelectorAll(".seg");
  const { W, U, c, segL, hL } = mixGeom(mb), mids = [], names = mb.segs.map(g => g.name());
  mb.segs.forEach((g, i) => {
    const w = share(mb, g.key), el = segs[i];
    el.style.left = segL(i) + "px"; el.style.width = w * U + "px";
    el.title = `${names[i]} ${nf2.format(w)}%`;
    mids.push(segL(i) + w * U / 2);
  });

  // Labels sit above their segment's midpoint, pushed apart so they never overlap, with a
  // leader line down to the segment (so even a 0% segment is visible).
  const lbls = mb.labels;
  lbls.forEach((el, i) => {
    el.querySelector("b").textContent = names[i];
    el.querySelector("u").textContent = nf2.format(share(mb, mb.segs[i].key)) + "%";
  });
  const GAP = 8, wd = lbls.map(el => el.offsetWidth), left = [];
  for (let i = 0; i < lbls.length; i++) {
    left[i] = Math.max(mids[i] - wd[i] / 2, i ? left[i - 1] + wd[i - 1] + GAP : 0);
  }
  for (let i = lbls.length - 1; i >= 0; i--) {
    left[i] = Math.min(left[i], i < lbls.length - 1 ? left[i + 1] - wd[i] - GAP : W - wd[i]);
  }
  for (let i = 0; i < lbls.length; i++) left[i] = Math.max(left[i], i ? left[i - 1] + wd[i - 1] + GAP : 0);
  const H = mb.lead.clientHeight;
  let d = "";
  lbls.forEach((el, i) => {
    el.style.left = left[i] + "px";
    const x = left[i] + wd[i] / 2, m = Math.min(W - 0.5, Math.max(0.5, mids[i]));
    d += `M${x} 0V3L${m} ${H - 3}V${H}`;
  });
  mb.lead.querySelector("path").setAttribute("d", d);
  bar.querySelectorAll(".h").forEach((el, i) => {
    el.style.left = hL(i) + "px"; el.style.width = HANDLE_W + "px";
    el.setAttribute("aria-label", `Boundary between ${names[i]} and ${names[i + 1]}`);
    el.setAttribute("aria-valuemin", i ? c[i - 1] : 0);
    el.setAttribute("aria-valuemax", i < c.length - 1 ? c[i + 1] : 100);
    el.setAttribute("aria-valuenow", c[i]);
  });
}

function update(src) {
  readValues();
  // Sync all input widgets (except the one being typed into).
  for (const el of document.querySelectorAll("input[data-k]")) {
    const s = INPUTS[el.dataset.k];
    el.max = s.max;
    if (el !== src) el.value = V[el.dataset.k];
  }
  const L = compute();
  Object.values(MIXBARS).forEach(updateMixBar);

  for (const el of document.querySelectorAll("[data-hdr]")) {
    el.textContent = el.dataset.hdr === "A" ? ROWS.lA() : ROWS.lB();
  }
  for (const r of ROWS) {
    if (!r.id) continue;
    if (r.kind === "calc1") {
      document.querySelector(`[data-id="${r.id}"]`).innerHTML = fmtVal(L[r.id], r.fmt);
    } else if (r.kind === "calc2") {
      for (const c of ["A", "B"]) document.querySelector(`[data-id="${r.id}"][data-c="${c}"]`).innerHTML = fmtVal(L[r.id][c], r.fmt);
    }
  }

  // Key algorithm table.
  let a = `<tr><th>Algorithm</th><th class="v">SPKI DER (B)</th><th class="v">Key bytes, incompressible</th>` +
          `<th class="v">Record: 4 + SPKI</th><th class="v">Record compressed: key + 3</th><th class="v">Mix</th></tr>`;
  for (const g of ALGS) {
    a += `<tr><td>${g.name}</td><td class="v">${g.spki}</td><td class="v">${g.rand}</td>` +
         `<td class="v">${REC_HDR + g.spki}</td><td class="v">${g.rand + GZ_REF}</td>` +
         `<td class="v">${nf2.format(mix(g.key) * 100)}%</td></tr>`;
  }
  document.getElementById("algs").innerHTML = a;

  // Summary.
  const { caObj, caU, caS, pkObj, pkS } = totals(L);
  const rows = [
    [ROWS.lA(), "L40A, L41A, L42A", L[40].A, L[41].A, L[42].A],
    [ROWS.lB(), "L40B, L41B, L42B", L[40].B, L[41].B, L[42].B],
    ["CA total", "A + B", caObj, caU, caS, true],
    ["Mirror", "L67, L68, L69", L[67], L[68], L[69]],
    ["Mirror ÷ CA", "", L[67] / caObj, L[68] / caU, L[69] / caS, false, true],
  ];
  let s = `<tr><th></th><th>From</th><th class="v">Objects</th><th class="v">Uncompressed</th><th class="v">Stored (compressed)</th></tr>`;
  for (const [name, from, o, u, st, tot, ratio] of rows) {
    const f = ratio ? (x => Number.isFinite(x) ? nf2.format(x) + "×" : "—") : null;
    s += `<tr${tot ? ' class="total"' : ""}><td>${name}</td><td class="f">${from}</td>` +
         `<td class="v">${f ? f(o) : num(o)}</td><td class="v">${f ? f(u) : bytesCell(u)}</td><td class="v">${f ? f(st) : bytesCell(st)}</td></tr>`;
  }
  document.getElementById("summary").innerHTML = s;

  // Headline.
  const gib = x => Number.isFinite(x) ? nf2.format(x / 2 ** 30) + " GiB" : "—";
  const hl = (name, f, o, b, tot) =>
    `<tr${tot ? ' class="total"' : ""}><td>${name}</td><td class="f">${f}</td>` +
    `<td class="v">${num(o)}</td><td class="v">${gib(b)}</td></tr>`;
  document.getElementById("headline").innerHTML =
    `<tr class="part"><th colspan="2">Summary</th><th class="v">Objects</th><th class="v">Stored (compressed)</th></tr>` +
    hl("Let's Encrypt CA: standard log", "Σ(L40 − (L25 + 1) × L1), Σ(L42 − L43)", caObj - pkObj, caS - pkS) +
    hl("Let's Encrypt CA: pubkey tiles", "Σ((L25 + 1) × L1), Σ L43", pkObj, pkS) +
    hl("Let's Encrypt CA: total", "Σ L40, Σ L42", caObj, caS, true) +
    hl("Every MTCA Mirror", "L67, L69", L[67], L[69], true);

  try {
    const q = new URLSearchParams();
    for (const [k, sp] of Object.entries(INPUTS)) q.set(k, sp.v);
    history.replaceState(null, "", "#" + q.toString());
  } catch (e) {}
}

// ---------- CSV export ----------
// Spreadsheet formulas for each calculated line. "L20" refers to line 20 in the same
// column (A or B) as the formula, "L61A" to a specific column; single-value lines live in
// column A.
const LVL = Array.from({ length: HASH_LEVELS }, (_, k) => k ? `1/256^${k}` : "1").join("+");
const MIXLINE = Object.fromEntries(MIXBARS.key.segs.map(g => [g.key, MIXBARS.key.id + g.sfx]));
const hashBytesX = n => `${HASH}*(` + Array.from({ length: HASH_LEVELS }, (_, k) => k ? `INT(${n}/256^${k})` : `INT(${n})`).join("+") + ")";
const XF = {
  5: "100-L5A",
  [MIXLINE.rsa]: "100-" + MIXKEYS.map(k => "L" + MIXLINE[k]).join("-"),
  12: "(" + ALGS.map(a => `L${MIXLINE[a.key]}*${REC_HDR + a.spki}`).join("+") + ")/100",
  13: "(" + ALGS.map(a => `L${MIXLINE[a.key]}*${a.rand + GZ_REF}`).join("+") + ")/100",
  14: `${ENT_HDR}+L7`,
  15: "L14*L8/100",
  16: `${TILE}*${HASH}`,
  17: "L4*1000000*L5/100",
  18: "L17/MIN(L3,L2)",
  19: "L18*L2",
  20: "IF(L1=0,0,L18/L1)",
  21: "L20/86400",
  22: "L2+L9a",
  23: "L20*L22",
  24: "INT(L23/256)",
  25: "L24",
  26: "INT(L23/256)",
  27: "INT(L23/256^2)",
  28: "INT(L23/256^3)",
  29: "INT(L23/256^4)",
  30: `IF(L23>0,${2 + HASH_LEVELS},0)`,
  31: "IF(L23>0,2,0)",
  32: "L24+L25+L26+L27+L28+L29+L30+L31",
  33: "L23*L14",
  34: "L23*L15",
  35: "L23*L12",
  36: "L23*L13",
  37: hashBytesX("L23"),
  38: "L33+L35+L37",
  39: "L34+L36+L37",
  40: "L32*L1",
  41: "L38*L1",
  42: "L39*L1",
  43: "L36*L1",
  44: "MIN(86400/L10,L20)",
  45: "IF(L44=0,0,L20/L44)",
  46: `L20/256*(2+${LVL})`,
  47: "IF(L45<=0,0," + Array.from({ length: HASH_LEVELS }, (_, k) => k ? `MIN(1,L45/256^${k})` : "MIN(1,L45)").join("+") + ")",
  48: "L44*(2+L47)",
  49: "L48",
  50: "L44",
  51: "L46+L48+L49+L50",
  52: `L20*(L15+L13+${HASH}*(${LVL}))`,
  53: `L44*${PART_FILL}*(L15+L13+${HASH}*L47)`,
  54: "L52+L53",
  55: "L51*L1",
  56: "L54*L1",
  57: "L2+L9b",
  58: "L20*L1*L57/(L11/100)",
  59: "INT(L58/256)",
  60: Array.from({ length: HASH_LEVELS }, (_, k) => `INT(L58/256^${k + 1})`).join("+"),
  61: "L59+L60",
  62: "L58*L14",
  63: "L58*L15",
  64: hashBytesX("L58"),
  65: "L62+L64",
  66: "L63+L64",
  67: "L61A+L61B",
  68: "L65A+L65B",
  69: "L66A+L66B",
};
// Summary lines: [label, formula, value from totals()].
const PK_OBJ = "(L25A+IF(L23A>0,1,0))*L1A+(L25B+IF(L23B>0,1,0))*L1B";
const XF_SUMMARY = [
  ["CA total: objects", "L40A+L40B", T => T.caObj],
  ["CA total: uncompressed", "L41A+L41B", T => T.caU],
  ["CA total: stored (compressed)", "L42A+L42B", T => T.caS],
  ["CA pubkey tiles: objects", PK_OBJ, T => T.pkObj],
  ["CA pubkey tiles: stored (compressed)", "L43A+L43B", T => T.pkS],
  ["CA standard log: objects", `L40A+L40B-(${PK_OBJ})`, T => T.caObj - T.pkObj],
  ["CA standard log: stored (compressed)", "L42A+L42B-L43A-L43B", T => T.caS - T.pkS],
  ["Mirror ÷ CA: objects", "L67/(L40A+L40B)", (T, L) => L[67] / T.caObj],
  ["Mirror ÷ CA: uncompressed", "L68/(L41A+L41B)", (T, L) => L[68] / T.caU],
  ["Mirror ÷ CA: stored (compressed)", "L69/(L42A+L42B)", (T, L) => L[69] / T.caS],
];

// Columns: line, description, formula, A, B, JS A, JS B, check A, check B.
function buildCSV() {
  readValues();
  const L = compute(), T = totals(L);
  const COL = { A: "D", B: "E" }, JS = { A: "F", B: "G" }, CHK = { A: "H", B: "I" };
  const two = new Set(["in2", "calc2"]);
  const rowOf = {}, twoCol = {};
  let n = 2;
  for (const r of ROWS) {
    if (r.kind === "algs") continue;
    if (r.kind === "summary") { n += XF_SUMMARY.length; continue; }
    if (r.kind === "mix" && !MIXBARS[r.mix].cols) {
      for (const g of MIXBARS[r.mix].segs) { rowOf[r.id + g.sfx] = n++; twoCol[r.id + g.sfx] = false; }
      continue;
    }
    if (r.kind === "mix") { rowOf[r.id] = n++; twoCol[r.id] = true; continue; }
    if (r.id) { rowOf[r.id] = n; twoCol[r.id] = two.has(r.kind); }
    n++;
  }
  const lastRow = n;
  const fx = (src, c) => "=" + src.replace(/\bL(\d+[a-d]?)([AB]?)\b/g, (m, id, cc) => {
    if (!(id in rowOf)) throw new Error("bad ref " + m);
    return (twoCol[id] ? COL[cc || c] : "D") + rowOf[id];
  });
  const jsv = x => Number.isFinite(x) ? String(x) : "";
  const chk = (v, j) => `=IF(ISERROR(${v}),IF(${j}="","OK","MISMATCH"),` +
    `IFERROR(IF(ABS(${v}-${j})<=1E-9*MAX(1,ABS(${j})),"OK","MISMATCH"),"MISMATCH"))`;

  const calcIn = (cells, row, c, x) => {
    cells[c === "A" ? 3 : 4] = x.f;
    cells[c === "A" ? 5 : 6] = jsv(x.js);
    cells[c === "A" ? 7 : 8] = chk(COL[c] + row, JS[c] + row);
  };
  const out = [["Line", "Description", "Formula", "A", "B", "JS A", "JS B", "Check A", "Check B"]];
  for (const r of ROWS) {
    const row = out.length + 1;
    const cells = new Array(9).fill("");
    const calc = (c, x) => calcIn(cells, row, c, x);
    if (r.kind === "algs") continue;
    if (r.kind === "mix") {
      const mb = MIXBARS[r.mix];
      // Stored shares are inputs; the remaining share is a formula.
      const segCell = (g, c, cells, row) => {
        if (mb.stored.includes(g.key)) cells[c === "A" ? 3 : 4] = V[g.key];
        else calcIn(cells, row, c, { f: fx(XF[mb.cols ? r.id : r.id + g.sfx], c), js: share(mb, g.key) });
      };
      if (mb.cols) {
        const cells = new Array(9).fill(""), row = out.length + 1;
        cells[0] = r.id; cells[1] = r.label; cells[2] = r.f;
        for (const g of mb.segs) segCell(g, g.sfx, cells, row);
        out.push(cells);
      } else {
        for (const g of mb.segs) {
          const cells = new Array(9).fill(""), row = out.length + 1;
          cells[0] = r.id + g.sfx; cells[1] = `${r.label}: ${g.name()}`;
          if (!mb.stored.includes(g.key)) cells[2] = r.f;
          segCell(g, "A", cells, row);
          out.push(cells);
        }
      }
      continue;
    }
    if (r.kind === "summary") {
      for (const [label, f, v] of XF_SUMMARY) {
        const s = new Array(9).fill("");
        s[1] = label; s[2] = f;
        s[3] = fx(f, "A"); s[5] = jsv(v(T, L)); s[7] = chk("D" + (out.length + 1), "F" + (out.length + 1));
        out.push(s);
      }
      continue;
    }
    if (r.kind === "part") {
      cells[1] = r.label;
      if (r.cols) { cells[3] = ROWS.lA(); cells[4] = ROWS.lB(); }
      out.push(cells);
      continue;
    }
    cells[0] = r.id; cells[1] = r.label.trim(); cells[2] = r.f || "";
    if (r.kind === "in1") cells[3] = V[r.key];
    else if (r.kind === "in2") { cells[3] = V[r.keys[0]]; cells[4] = V[r.keys[1]]; }
    else if (r.kind === "calc1") calc("A", { f: fx(XF[r.id], "A"), js: L[r.id] });
    else if (r.kind === "calc2") for (const c of ["A", "B"]) calc(c, { f: fx(XF[r.id], c), js: L[r.id][c] });
    out.push(cells);
  }
  out.push(["", "All checks", "", "", "", "", "", `=IF(COUNTIF(H2:I${lastRow - 1},"MISMATCH")=0,"OK","MISMATCH")`, ""]);
  if (out.length !== lastRow) throw new Error("row count mismatch");
  const esc = v => { v = String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  // BOM so Excel reads the file as UTF-8.
  return "\ufeff" + out.map(r => r.map(esc).join(",")).join("\r\n") + "\r\n";
}

function downloadCSV() {
  const url = URL.createObjectURL(new Blob([buildCSV()], { type: "text/csv;charset=utf-8" }));
  const a = document.createElement("a");
  a.href = url; a.download = "mtc-storage.csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

constrain();
readValues();
defineRows();
build();
update();
document.getElementById("csv").addEventListener("click", downloadCSV);
</script>
</body>
